services:
  app:
    build: ../backend
    container_name: pokemon-backend
    expose:
      - '${PORT}'
      - '9080'
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - RESTATE_URL=${RESTATE_URL}
    depends_on:
      mysql-db:
        condition: service_healthy

  mysql-db:
    image: mysql:8.0
    container_name: pokemon-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: pokemon-proxy
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  restate:
    image: docker.io/restatedev/restate:latest
    container_name: pokemon-restate
    ports:
      - '8080:8080'
      - '9070:9070'
    depends_on:
      - app

  restate-setup:
    image: curlimages/curl
    depends_on:
      - restate
      - app
    command: >
      sh -c "sleep 5 && curl --fail --retry 10 --retry-delay 3 -X POST http://restate:9070/deployments -H 'Content-Type: application/json' -d '{\"uri\": \"http://app:9080\"}'"

volumes:
  mysql_data:
