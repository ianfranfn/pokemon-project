services:
  app:
    build: ../backend
    container_name: pokemon-backend
    expose:
      - '${PORT:-4000}' # Expose application to the Docker network
    environment:
      - PORT=${PORT:-4000}
      - DB_HOST=${DB_HOST} # Uses the service name as the host
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT:-3306}
      - JWT_SECRET=${JWT_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - MIGRATIONS_DIR=/migrations
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      mysql-db: # Ensure the database starts before the app
        condition: service_healthy # Waits for it to be healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:${PORT:-4000}/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql-db:
    image: mysql:8.0
    container_name: pokemon-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - '3307:3306' # Expose MySQL on port 3307 to the host
    volumes:
      - mysql_data:/var/lib/mysql # Persist MySQL data even with container restarts
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: pokemon-proxy
    ports:
      - '80:80' # Nginx exposes port 80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  restate:
    image: docker.io/restatedev/restate:latest
    container_name: pokemon-restate
    ports:
      - '8080:8080'
      - '9070:9070'
    depends_on:
      - app

  restate-setup:
    image: curlimages/curl
    depends_on:
      - restate
    command: >
      sh -c "sleep 5 && curl -X POST http://restate:9070/deployments -H 'Content-Type: application/json' -d '{\"uri\": \"http://host.docker.internal:9080\"}'"

volumes:
  mysql_data:
